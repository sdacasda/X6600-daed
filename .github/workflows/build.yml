name: AX6600 PLUS + daed

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'config = only check configuration; firmware = full build'
        type: choice
        options:
          - config
          - firmware
        default: config
        required: true

permissions:
  contents: read

concurrency:
  group: ax6600-daed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WRT_SOURCE_DIR: /mnt/ax6600-daed/source
      WRT_BUILDER_DIR: /mnt/ax6600-daed/builder
      BUILD_MODE: ${{ inputs.mode }}
      CCACHE_DIR: /mnt/ax6600-daed/ccache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test build guards
        run: node --test tests/*.test.mjs
      - name: Prepare disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          # Only hosted Ubuntu runner SDKs; never executed on the router.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo mkdir -p /mnt/ax6600-daed
          sudo chown "$USER:$(id -gn)" /mnt/ax6600-daed
          mkdir -p reports
          df -h / /mnt | tee reports/disk-before.txt
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 llvm-18 lld-18 cmake flex bison g++ \
            gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl libelf-dev \
            pahole libfuse-dev libxml2-dev jq pkgconf xsltproc subversion ccache \
            device-tree-compiler
          /usr/lib/llvm-18/bin/clang --version | tee reports/clang-version.txt
          /usr/lib/llvm-18/bin/clang --target=bpfel -x c -c /dev/null -o /tmp/daed-bpf-test.o
          pahole --version | tee reports/pahole-system-version.txt
      - name: Fetch pinned sources and check configuration
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare.sh 2>&1 | tee reports/prepare.log
      - name: Download and build firmware
        if: inputs.mode == 'firmware'
        shell: bash
        run: |
          set -euo pipefail
          reports_dir="$GITHUB_WORKSPACE/reports"
          cd "$WRT_SOURCE_DIR"
          make download -j8 2>&1 | tee "$reports_dir/download.log"
          if ! make -j2 2>&1 | tee "$reports_dir/build.log"; then
            make -j1 V=s 2>&1 | tee "$reports_dir/build-retry.log"
          fi
      - name: Verify BTF, kernel size, target and packages
        if: inputs.mode == 'firmware'
        run: node scripts/build.mjs verify-artifacts
      - name: Save checked firmware
        if: success() && inputs.mode == 'firmware'
        uses: actions/upload-artifact@v4
        with:
          name: AX6600-PLUS-daed-candidate-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AX6600-daed-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## AX6600 PLUS + daed'
            echo "Mode: $BUILD_MODE"
            echo 'Firmware artifacts are created only after config, BTF, FIT and manifest checks pass.'
            echo 'No router was flashed. Actual partition capacity and hardware compatibility still need verification.'
          } >> "$GITHUB_STEP_SUMMARY"
